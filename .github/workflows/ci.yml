name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The store commits to git on save, and the backup tests push to a local
  # bare repository; both need an identity.
  GIT_AUTHOR_NAME: leo-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: leo-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Unit, integration and end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log; then
            grep -E "panicked|FAILED|^error|^failures:|assertion|left:|right:|undefined reference|could not" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: '12.9.1'
      - name: Browser integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pnpm --dir crates/leo-web/tests/browser install --frozen-lockfile
          pnpm --dir crates/leo-web/tests/browser exec playwright install --with-deps chromium
          pnpm --dir crates/leo-web/tests/browser test

      - name: Install and run on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'leo-install'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Compress-Archive -Path target/debug/leo.exe -DestinationPath (Join-Path $work 'leo.zip') -Force
          $env:LEO_INSTALL_ARCHIVE = Join-Path $work 'leo.zip'
          $env:LEO_INSTALL_DIR = Join-Path $work 'bin'
          $env:LEO_INSTALL_NO_MODEL = '1'
          $env:LEO_INSTALL_SKIP_PATH = '1'
          $env:LEO_HOME = Join-Path $work 'home'
          $env:LEO_NO_UPDATE_CHECK = '1'
          $env:LEO_NO_MICROPHONE = '1'
          function Check([string]$Label, [scriptblock]$Block, [int[]]$Ok = @(0)) {
            $global:LASTEXITCODE = 0
            try {
              $out = & $Block *>&1 | Out-String
            } catch {
              Write-Host "::error::$Label threw: $($_ | Out-String)"
              exit 1
            }
            Write-Host $out
            if ($Ok -notcontains $LASTEXITCODE) {
              $flat = ($out -replace "`r?`n", ' | ')
              Write-Host "::error::$Label failed (exit $LASTEXITCODE): $flat"
              exit 1
            }
            return $out
          }
          $leo = Join-Path $env:LEO_INSTALL_DIR 'leo.exe'
          Check 'install.ps1' { ./install.ps1 } | Out-Null
          Check 'leo --version' { & $leo --version } | Out-Null
          Check 'leo new' { & $leo new "From Windows" --body "hello" } | Out-Null
          $listed = Check 'leo list' { & $leo list }
          if ($listed -notmatch 'From Windows') { Write-Host "::error::leo list did not show the new note: $listed"; exit 1 }
          Check 'install.ps1 again' { ./install.ps1 } | Out-Null
          $report = Check 'leo doctor' { & $leo doctor } @(0, 1)
          if ($report -notmatch 'recording') { Write-Host "::error::leo doctor printed no report: $report"; exit 1 }
          exit 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace --all-targets --locked

  targets:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}

  release:
    needs: [test, lint, msrv, targets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
