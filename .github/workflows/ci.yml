name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # The store commits to git on save, and the backup tests push to a local
  # bare repository; both need an identity.
  GIT_AUTHOR_NAME: leo-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: leo-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  changes:
    runs-on: macos-latest
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      browser: ${{ steps.scope.outputs.browser }}
      systems: ${{ steps.scope.outputs.systems }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: What this push can affect
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true) ;;
            pull_request) base=$PR_BASE ;;
            *) base= ;;
          esac
          echo "Compared with ${base:-nothing (testing everything)}"
          sh scripts/ci-scope.sh "$base" | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.systems != '[]'
    concurrency:
      group: ci-test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit, integration and end-to-end tests
        shell: bash
        env:
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
        run: |
          set -o pipefail
          scope=--workspace
          [ "$RUST_CHANGED" = true ] || scope="-p leo-web"
          if ! cargo test $scope --locked --no-fail-fast 2>&1 | tee test.log; then
            grep -E "panicked|FAILED|^error|^failures:|assertion|left:|right:|undefined reference|could not" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Validate desktop release scripts
        run: python3 scripts/test_desktop_release.py
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-app.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Clippy for the app
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy -p leo-desktop --all-targets --locked -- -D warnings

  browser:
    name: browser (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    concurrency:
      group: ci-browser-${{ matrix.project }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, webkit]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test server
        run: cargo build --locked -p leo-host --bin leo-test-server
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v5
        with:
          version: '12.9.1'
      - name: Browser integration tests (${{ matrix.project }})
        run: |
          pnpm --dir crates/leo-web/tests/browser install --frozen-lockfile
          pnpm --dir crates/leo-web/tests/browser exec playwright install chromium webkit
          pnpm --dir crates/leo-web/tests/browser exec playwright test --project=${{ matrix.project }}
      - name: Browser previews and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-previews-${{ matrix.project }}
          path: |
            crates/leo-web/tests/browser/test-results/
            crates/leo-web/tests/browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: macos-latest
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude leo-desktop --all-targets --locked -- -D warnings

  msrv:
    name: minimum Rust version (1.88)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: ci-msrv-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude leo-desktop --all-targets --locked

  targets:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: ci-build-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

  go-runner:
    name: Go runner builds to its pinned files
    runs-on: macos-latest
    concurrency:
      group: ci-go-runner-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(sed 's/^go//' scripts/go-runner/GO_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - run: sh scripts/go-runner/build.sh "$RUNNER_TEMP/go-runner"

  java-runner:
    name: Java runner builds
    runs-on: macos-latest
    concurrency:
      group: ci-java-runner-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - id: jdk
        run: echo "version=$(cat scripts/java-runner/JDK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
      - run: sh scripts/java-runner/build.sh "$RUNNER_TEMP/java-runner"

  rust-runner:
    name: Rust runner gathers its pinned files
    runs-on: macos-latest
    concurrency:
      group: ci-rust-runner-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/rust-runner/build.sh "$RUNNER_TEMP/rust-runner"

  release:
    needs: [changes, test, browser, lint, msrv, targets, go-runner, java-runner, rust-runner]
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
