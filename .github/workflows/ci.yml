name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  # The store commits to git on save, and the backup tests push to a local
  # bare repository; both need an identity.
  GIT_AUTHOR_NAME: leo-ci
  GIT_AUTHOR_EMAIL: ci@example.com
  GIT_COMMITTER_NAME: leo-ci
  GIT_COMMITTER_EMAIL: ci@example.com

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      browser: ${{ steps.scope.outputs.browser }}
      systems: ${{ steps.scope.outputs.systems }}
      node: ${{ steps.scope.outputs.node }}
      installers: ${{ steps.scope.outputs.installers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check CI selection
        run: |
          python3 scripts/test_ci_scope.py
          node --test scripts/ci-base.test.cjs
      - id: base
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/ci-base.cjs')({ github, context, core, exec });
      - id: scope
        name: What this push can affect
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail
          sh scripts/ci-scope.sh "$BASE" | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-format-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-node-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test crates/leo-web/tests/*.test.js

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.systems != '[]'
    concurrency:
      group: ci-test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build speech for any recent x64 Windows CPU
        if: runner.os == 'Windows'
        shell: bash
        run: echo "TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_FMA=ON -DGGML_BMI2=ON -DGGML_AVX2=ON" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit, integration and end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --locked --no-fail-fast 2>&1 | tee test.log; then
            grep -E "panicked|FAILED|^error|^failures:|assertion|left:|right:|undefined reference|could not" test.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Validate desktop release scripts
        if: needs.changes.outputs.installers == 'true'
        run: python3 scripts/test_desktop_release.py
      - name: Check Windows installer syntax
        if: runner.os == 'Windows' && needs.changes.outputs.installers == 'true'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-app.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Clippy for the app
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy -p leo-desktop --all-targets --locked -- -D warnings

  browser-server:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    concurrency:
      group: ci-browser-server-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the test server
        run: cargo build --locked -p leo-host --bin leo-test-server
      - uses: actions/upload-artifact@v6
        with:
          name: browser-server
          path: target/debug/leo-test-server
          retention-days: 1

  browser:
    name: browser (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: [changes, browser-server]
    if: needs.changes.outputs.browser == 'true'
    concurrency:
      group: ci-browser-${{ matrix.project }}-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
            shard: 1
            shards: 4
          - project: desktop
            browser: chromium
            shard: 2
            shards: 4
          - project: desktop
            browser: chromium
            shard: 3
            shards: 4
          - project: desktop
            browser: chromium
            shard: 4
            shards: 4
          - project: webkit
            browser: webkit
            shard: 1
            shards: 1
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: browser-server
          path: target/debug
      - run: chmod +x target/debug/leo-test-server
      - uses: pnpm/action-setup@v5
        with:
          version: '12.9.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: crates/leo-web/tests/browser/pnpm-lock.yaml
      - name: Install browser test dependencies
        run: pnpm --dir crates/leo-web/tests/browser install --frozen-lockfile
      - name: Check browser shard coverage
        if: matrix.project == 'desktop' && matrix.shard == 1
        run: pnpm --dir crates/leo-web/tests/browser run test:shards
      - name: Browser integration tests (${{ matrix.project }}, ${{ matrix.shard }}/${{ matrix.shards }})
        run: |
          pnpm --dir crates/leo-web/tests/browser exec playwright install ${{ matrix.browser }}
          pnpm --dir crates/leo-web/tests/browser exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Browser previews and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-previews-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            crates/leo-web/tests/browser/test-results/
            crates/leo-web/tests/browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --exclude leo-desktop --all-targets --locked -- -D warnings

  msrv:
    name: minimum Rust version (1.88)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: ci-msrv-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --exclude leo-desktop --all-targets --locked

  targets:
    name: build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    concurrency:
      group: ci-build-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build speech for any recent x64 Windows CPU
        if: runner.os == 'Windows'
        shell: bash
        run: echo "TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_FMA=ON -DGGML_BMI2=ON -DGGML_AVX2=ON" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

  ci:
    name: CI passed
    needs: [changes, format, node, test, browser-server, browser, lint, msrv, targets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in jobs.items() if job['result'] not in ('success', 'skipped')]
          if jobs['changes']['result'] != 'success' or jobs['format']['result'] != 'success' or failed:
              raise SystemExit(f"CI did not pass: {', '.join(failed)}")
          PY

  release:
    needs: ci
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ci.result == 'success'
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
