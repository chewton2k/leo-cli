name: Release

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require persistent signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Add the repository Actions secret $name before releasing."; exit 1; }
          done
      - id: next
        name: Next version
        run: |
          version=$(sh scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version"
          else
            echo "Nothing to release: leo itself has not changed since the last release."
          fi

  bump:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: commit
        name: Commit the version
        run: |
          version="${{ needs.version.outputs.version }}"
          sh scripts/set-version.sh "$version"
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: v$version"
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on; the run for the newer push releases instead."
          fi

  build:
    name: app (${{ matrix.target }})
    needs: bump
    if: needs.bump.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: app,dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: app,dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v5
        with:
          version: '12.9.1'
      - name: Install desktop tools
        run: pnpm --dir crates/leo-desktop install --frozen-lockfile
      - name: Import the stable macOS identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 scripts/import_macos_certificate.py
      - name: Bundle the terminal command
        shell: bash
        run: |
          cargo build --release --locked -p leo --target '${{ matrix.target }}'
          mkdir -p crates/leo-desktop/binaries
          ext=''
          [ "$RUNNER_OS" != Windows ] || ext=.exe
          cp "target/${{ matrix.target }}/release/leo$ext" "crates/leo-desktop/binaries/leo-${{ matrix.target }}$ext"
      - name: Build the app and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir crates/leo-desktop tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.release.conf.json
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='target/${{ matrix.target }}/release/bundle/macos/Leo.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict "$app/Contents/MacOS/leo"
          codesign -d --verbose=4 "$app" 2>&1 | grep -F 'Authority=Leo Desktop Signing'
          codesign -d --verbose=4 "$app/Contents/MacOS/leo" 2>&1 | grep -F 'Authority=Leo Desktop Signing'
      - name: Package release assets
        run: python3 scripts/desktop_release.py package target/${{ matrix.target }}/release/bundle release-assets ${{ matrix.target }}
      - name: Try the macOS app installer in a throwaway home
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          work="$RUNNER_TEMP/leo-installer-check"
          export HOME="$work/home"
          export LEO_HOME="$work/data"
          export LEO_APPLICATIONS_DIR="$work/Applications"
          export LEO_INSTALL_DIR="$work/bin"
          export LEO_INSTALL_SKIP_PATH=1
          export LEO_INSTALL_ARCHIVE="$PWD/release-assets/leo-${{ matrix.target }}.app.tar.gz"
          sh scripts/install-app.sh
          "$LEO_INSTALL_DIR/leo" --version
      - name: Try the Windows app installer in a throwaway home
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'leo-installer-check'
          $env:LEO_HOME = Join-Path $work 'data'
          $env:LEO_WINDOWS_APP_DIR = Join-Path $work 'app with spaces'
          $env:LEO_INSTALL_DIR = Join-Path $work 'bin with spaces'
          $env:LEO_INSTALL_SKIP_PATH = '1'
          $env:LEO_INSTALL_ARCHIVE = Join-Path $PWD 'release-assets/leo-${{ matrix.target }}-setup.exe'
          ./scripts/install-app.ps1
          & (Join-Path $env:LEO_INSTALL_DIR 'leo.cmd') --version
          if ($LASTEXITCODE) { throw 'The installed command did not run.' }
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${LEO_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$LEO_BUILD_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: leo-${{ matrix.target }}
          path: release-assets/*

  go-runner:
    needs: bump
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - id: go
        run: echo "version=$(sed 's/^go//' scripts/go-runner/GO_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: Build the Go runner
        run: |
          sh scripts/go-runner/build.sh "$RUNNER_TEMP/go-runner"
          cp "$RUNNER_TEMP/go-runner/leo-go.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: leo-go
          path: leo-go.tar.gz

  java-runner:
    needs: bump
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - id: jdk
        run: echo "version=$(cat scripts/java-runner/JDK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.version }}
      - name: Build the Java runner
        run: |
          sh scripts/java-runner/build.sh "$RUNNER_TEMP/java-runner"
          cp "$RUNNER_TEMP/java-runner/leo-java.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: leo-java
          path: leo-java.tar.gz

  rust-runner:
    needs: bump
    if: needs.bump.outputs.sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - name: Gather the Rust runner
        run: |
          sh scripts/rust-runner/build.sh "$RUNNER_TEMP/rust-runner"
          cp "$RUNNER_TEMP/rust-runner/leo-rust.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: leo-rust
          path: leo-rust.tar.gz

  publish:
    needs: [version, bump, build, go-runner, java-runner, rust-runner]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Release notes
        run: |
          previous=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "## What changed"
            echo
            git log --no-merges --invert-grep --grep='^release: v' \
              --format='- %s' ${previous:+"$previous..HEAD"}
            echo
            echo "## Install or update"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "On Windows, in PowerShell:"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex"
            echo '```'
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Include the app installers
        run: |
          cp scripts/install-app.sh dist/install.sh
          cp scripts/install-app.ps1 dist/install.ps1
      - name: Create the updater manifest
        run: python3 scripts/desktop_release.py manifest dist '${{ needs.version.outputs.version }}' notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.bump.outputs.sha }}
          name: leo v${{ needs.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*

      - name: Enable main-branch app installers after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/leo-published-release.json"
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/activate_app_installers.py "$RUNNER_TEMP/leo-published-release.json" dist '${{ needs.version.outputs.version }}'
          if git diff --quiet -- install.sh install.ps1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh install.ps1
          git commit -m "release: enable desktop app installers"
          git pull --rebase origin main
          git push origin HEAD:main
