name: Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        name: Next version
        run: |
          version=$(sh scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version"
          else
            echo "Nothing to release: leo itself has not changed since the last release."
          fi

  bump:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: commit
        name: Commit the version
        run: |
          version="${{ needs.version.outputs.version }}"
          sh scripts/set-version.sh "$version"
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: v$version"
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on; the run for the newer push releases instead."
          fi

  build:
    name: build (${{ matrix.target }})
    needs: bump
    if: needs.bump.outputs.sha != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # 22.04 rather than latest: a binary built against an older glibc
          # runs on more Linux systems.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="leo-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" leo
          if command -v shasum >/dev/null; then
            shasum -a 256 "$name" > "$name.sha256"
          else
            sha256sum "$name" > "$name.sha256"
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "leo-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/leo.exe" -DestinationPath $name
          $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
          Set-Content -Path "$name.sha256" -Value "$hash  $name" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: leo-${{ matrix.target }}
          path: leo-${{ matrix.target }}.*

  publish:
    needs: [version, bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Release notes
        run: |
          previous=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "## What changed"
            echo
            git log --no-merges --invert-grep --grep='^release: v' \
              --format='- %s' ${previous:+"$previous..HEAD"}
            echo
            echo "## Install or update"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "On Windows, in PowerShell:"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex"
            echo '```'
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.bump.outputs.sha }}
          name: leo v${{ needs.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*
            install.sh
            install.ps1
