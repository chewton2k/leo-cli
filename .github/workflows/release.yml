name: Release

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require persistent signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Add the repository Actions secret $name before releasing."; exit 1; }
          done
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: '12.9.1'
      - name: Install updater signing tools
        run: pnpm --dir crates/leo-desktop install --frozen-lockfile
      - name: Validate updater signing before building
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/validate_updater_signing.py
      - id: next
        name: Next version
        run: |
          version=$(sh scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing v$version"
          else
            echo "Nothing to release: leo itself has not changed since the last release."
          fi

  bump:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: commit
        name: Commit the version
        run: |
          version="${{ needs.version.outputs.version }}"
          sh scripts/set-version.sh "$version"
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: v$version"
          if git push origin HEAD:main; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on; the run for the newer push releases instead."
          fi

  build:
    name: app (${{ matrix.target }})
    needs: bump
    if: needs.bump.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: app,dmg
            config: tauri.release.conf.json
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: app,dmg
            config: tauri.release.conf.json
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: nsis
            config: tauri.release.windows.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      - name: Build speech for any recent x64 Windows CPU
        if: runner.os == 'Windows'
        shell: bash
        run: echo "TRANSCRIBE_CMAKE_ARGS=-DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON -DGGML_FMA=ON -DGGML_BMI2=ON -DGGML_AVX2=ON" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: desktop-${{ matrix.target }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: '12.9.1'
      - name: Install desktop tools
        run: pnpm --dir crates/leo-desktop install --frozen-lockfile
      - name: Import the stable macOS identity
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: python3 scripts/import_macos_certificate.py
      - name: Bundle the terminal command
        shell: bash
        run: |
          cargo build --release --locked -p leo --target '${{ matrix.target }}'
          mkdir -p crates/leo-desktop/binaries
          ext=''
          [ "$RUNNER_OS" != Windows ] || ext=.exe
          cp "target/${{ matrix.target }}/release/leo$ext" "crates/leo-desktop/binaries/leo-${{ matrix.target }}$ext"
      - name: Stage the app-local Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage_windows_runtime.ps1
      - name: Build the app and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --dir crates/leo-desktop tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ matrix.config }}
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app='target/${{ matrix.target }}/release/bundle/macos/Leo.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict "$app/Contents/MacOS/leo"
          codesign -d --verbose=4 "$app" 2>&1 | grep -F 'Authority=Leo Desktop Signing'
          codesign -d --verbose=4 "$app/Contents/MacOS/leo" 2>&1 | grep -F 'Authority=Leo Desktop Signing'
      - name: Package release assets
        run: python3 scripts/desktop_release.py package target/${{ matrix.target }}/release/bundle release-assets ${{ matrix.target }}
      - name: Try the macOS app installer in a throwaway home
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          work="$RUNNER_TEMP/leo-installer-check"
          export HOME="$work/home"
          export LEO_HOME="$work/data"
          export LEO_APPLICATIONS_DIR="$work/Applications"
          export LEO_INSTALL_DIR="$work/bin"
          export LEO_INSTALL_SKIP_PATH=1
          export LEO_INSTALL_ARCHIVE="$PWD/release-assets/leo-${{ matrix.target }}.app.tar.gz"
          sh scripts/install-app.sh
          "$LEO_INSTALL_DIR/leo" --version
      - name: Try the Windows app installer in a throwaway home
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'leo-installer-check'
          $env:LEO_HOME = Join-Path $work 'data'
          $env:LEO_WINDOWS_APP_DIR = Join-Path $work 'app with spaces'
          $env:LEO_INSTALL_DIR = Join-Path $work 'bin with spaces'
          $env:LEO_INSTALL_SKIP_PATH = '1'
          $env:LEO_INSTALL_ARCHIVE = Join-Path $PWD 'release-assets/leo-${{ matrix.target }}-setup.exe'
          ./scripts/install-app.ps1
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path (Join-Path $env:LEO_WINDOWS_APP_DIR $dll))) { throw "The installed app is missing $dll." }
          }
          & (Join-Path $env:LEO_INSTALL_DIR 'leo.cmd') --version
          if ($LASTEXITCODE) { throw 'The installed command did not run.' }
      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${LEO_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$LEO_BUILD_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: leo-${{ matrix.target }}
          path: release-assets/*

  publish:
    needs: [version, bump, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Release notes
        run: |
          previous=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)
          {
            echo "## What changed"
            echo
            git log --no-merges --invert-grep --grep='^release: v' \
              --format='- %s' ${previous:+"$previous..HEAD"}
            echo
            echo "## Install or update"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo '```'
            echo
            echo "On Windows, in PowerShell:"
            echo
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex"
            echo '```'
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: dist
          merge-multiple: true
      - name: Include the app installers
        run: |
          cp scripts/install-app.sh dist/install.sh
          cp scripts/install-app.ps1 dist/install.ps1
      - name: Create the updater manifest
        run: python3 scripts/desktop_release.py manifest dist '${{ needs.version.outputs.version }}' notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.bump.outputs.sha }}
          name: leo v${{ needs.version.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*

      - name: Enable main-branch app installers after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/leo-published-release.json"
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/activate_app_installers.py "$RUNNER_TEMP/leo-published-release.json" dist '${{ needs.version.outputs.version }}'
          if git diff --quiet -- install.sh install.ps1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh install.ps1
          git commit -m "release: enable desktop app installers"
          git pull --rebase origin main
          git push origin HEAD:main
