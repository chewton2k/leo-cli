[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
leo-core = { path = "crates/leo-core" }
leo-services = { path = "crates/leo-services" }
leo-tui = { path = "crates/leo-tui" }
leo-web = { path = "crates/leo-web" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
dotenvy = "0.15"
keyring = "4"
local-ip-address = "0.6"
nucleo = "0.5"
qrcode = "0.14"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "1"
toml_edit = "0.25.13"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[package]
name = "leo"
description = "A CLI note-taking tool for programmers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors = []

[[bin]]
name = "leo"
path = "src/main.rs"

[dependencies]
leo-core.workspace = true
leo-services.workspace = true
leo-tui.workspace = true
leo-web.workspace = true
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
dirs.workspace = true
dotenvy.workspace = true
tokio.workspace = true

[dev-dependencies]
leo-services = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[profile.release]
strip = true
