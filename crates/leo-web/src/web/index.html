<style>
:root {

    --tone-sheet: #5fd38d;
    --tone-image: #b597ff;
    --tone-text: #b3b2ad;
    --hue-0: #7aa2ff; --hue-1: #3fcdb8; --hue-2: #72cc72; --hue-3: #eab54a; --hue-4: #ff9663; --hue-5: #ff7eb0; --hue-6: #b59bff; --hue-7: #4cc6e6;
    --hue-red: #ff6b6b; --hue-indigo: #8b85ff; --hue-violet: #b59bff; --hue-teal: #3fcdb8; --hue-amber: #eab54a; --hue-slate: #a3a29c;
  }
}

  --bg: #141414;
  --surface: #1d1d1c;

  --muted: #a3a29c;
  --faint: #6d6c67;
  --line: #2e2e2c;
  --accent: #8b85ff;
  --accent-soft: #29274a;
  --accent-text: #0f0e1f;
  --danger: #ff6b61;
  --good: #4cc47e;
  --mark: #5c4d0a;
  --code-bg: #242423;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
  --tone-pdf: #ff7a72;
  --tone-doc: #79abff;
  --tone-slides: #ff9b52;
  --tone-sheet: #5fd38d;
  --tone-image: #b597ff;
  --tone-text: #b3b2ad;
  --hue-0: #7aa2ff; --hue-1: #3fcdb8; --hue-2: #72cc72; --hue-3: #eab54a; --hue-4: #ff9663; --hue-5: #ff7eb0; --hue-6: #b59bff; --hue-7: #4cc6e6;
  --hue-red: #ff6b6b; --hue-indigo: #8b85ff; --hue-violet: #b59bff; --hue-teal: #3fcdb8; --hue-amber: #eab54a; --hue-slate: #a3a29c;

:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (min-width: 1000px) { html { scrollbar-gutter: stable; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  --side: 0px;
  --right: 0px;
  --mid: calc(var(--side) + (100% - var(--side) - var(--right)) / 2);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.bar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(var(--top) + 10px) 16px 10px;
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.bar.scrolled { border-bottom-color: var(--line); }
.bar-row { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 6px; min-height: 40px; }
.brand { font-weight: 750; font-size: 20px; letter-spacing: -.02em; border: 0; background: none; padding: 4px 6px 4px 2px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; white-space: nowrap; color: var(--muted); font-size: 15px; }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 8px; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
.crumbs button:last-child { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--faint); }
.icon-btn {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.search {
  max-width: 760px; margin: 8px auto 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
}
.search svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
.search input { flex: 1; border: 0; outline: 0; background: none; padding: 10px 0; font-size: 16px; }

main { max-width: 760px; margin: 0 auto; padding: 8px 16px calc(var(--bottom) + 110px); }
.section-title { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }

.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.folder {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); box-shadow: var(--shadow);
}
.folder svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
.folder .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .count { font-size: 12px; color: var(--muted); }
.folder > span { min-width: 0; display: flex; flex-direction: column; }

.cards { display: flex; flex-direction: column; gap: 10px; }
body.on-library main, body.on-library .bar-row, body.on-library .search { max-width: 1080px; }
.library-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.library-views { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.library-views .btn { border: 0; }
.library-views .btn svg { display: block; flex: none; width: 16px; height: 16px; }
.library-views [data-action="library-view"] { gap: 8px; }
.library-views [data-action="library-view"] > span { display: block; line-height: 1; }
.library-views .on { background: var(--accent-soft); color: var(--accent); }
.library-tools svg { width: 16px; height: 16px; flex: none; }
.library-choice select { height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 13.5px; font-weight: 600; cursor: pointer; max-width: 160px; }
.library-choice select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.library-none { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 2px; color: var(--muted); }
.library-none p { margin: 0; }
.library-cards.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.library-cards .card { display: flex; flex-direction: column; position: relative; min-width: 0; }
.library-cards .card-title { justify-content: space-between; }
.library-cards .card-snippet { margin-top: 6px; }
.library-cards .card-meta { margin-top: auto; padding-top: 12px; flex-wrap: wrap; }
.note-thumb { height: 168px; overflow: hidden; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); margin-bottom: 14px; }
.library-cards.list .note-thumb { display: none; }
.note-thumb .note-mini { padding: 12px 14px; margin: 0; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
.note-thumb .note-mini h1, .note-thumb .note-mini h2, .note-thumb .note-mini h3, .note-thumb .note-mini h4 { font-size: 13px; margin: 4px 0 8px; }
.note-thumb .note-mini p, .note-thumb .note-mini ul, .note-thumb .note-mini ol, .note-thumb .note-mini pre { margin: 0 0 8px; }
.note-thumb .note-mini pre, .note-thumb .note-mini table { font-size: 10px; }
.note-thumb .note-mini figure { margin: 0; }
.note-thumb .note-mini .note-img, .note-thumb .note-mini .drawing img { width: 100%; height: 140px; object-fit: contain; margin: 0; border: 0; background: none; }
.note-thumb .note-mini .diagram-art svg { max-height: 140px; width: 100%; }
.note-thumb .note-mini .task { gap: 6px; padding: 1px 0; }
.note-thumb .note-mini .task input { width: 12px; height: 12px; margin-top: 2px; }
.note-thumb .note-mini pre code { font-size: 10px; }
.dragging .crumbs [data-action="home"] { outline: 1px dashed var(--accent); outline-offset: 2px; }
@media (max-width: 599px) {
  .library-tools { gap: 6px; }
  .library-tools > .grow { display: none; }
  .library-sort { margin-left: auto; }
  .library-sort span { max-width: 125px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .library-cards.grid { gap: 12px; }
  .note-thumb { height: 160px; }
}
.card {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); cursor: pointer;
  background: var(--surface); border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow);
}
@media (hover: hover) { .card:hover { border-color: color-mix(in srgb, var(--accent) 22%, var(--line)); } }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-title { font-weight: 650; font-size: 16.5px; display: flex; align-items: center; gap: 4px; }
.card-title > span { min-width: 0; overflow-wrap: anywhere; }
.pin-toggle {
  flex: none; width: 30px; height: 30px; margin: -6px 0; display: grid; place-items: center;
  border: 0; border-radius: 9px; background: none; padding: 0;
}
.pin-toggle:hover { background: var(--accent-soft); }
.pin-toggle svg { width: 17px; height: 17px; stroke: var(--accent); fill: none; transition: fill .12s; }
.pin-toggle.on svg { fill: var(--accent); }
.card-snippet {
  color: var(--muted); font-size: 14.5px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-snippet mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.card-why { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--accent); }
.card-why svg { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; }
:is(.sheet, .sheet-gone).viewer { width: calc(100% - 16px); max-width: 1100px; height: 90vh; max-height: 90vh; display: flex; flex-direction: column; padding: 8px; overflow: hidden; }
:is(.sheet, .sheet-gone).viewer .grip { display: none; }
.viewer-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px 8px; flex-wrap: wrap; }
.viewer-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.viewer-tools a.btn { text-decoration: none; }
.viewer-frame { flex: 1; width: 100%; border: 0; border-radius: 12px; background: var(--surface-2); }
.viewer-pan { flex: 1; overflow: auto; border-radius: 12px; background: var(--surface-2); text-align: center; }
.viewer-img { width: calc(var(--zoom, 1) * 100%); max-width: none; height: auto; cursor: zoom-in; vertical-align: top; }
.viewer-text { flex: 1; overflow: auto; padding: 12px 16px; }
.viewer-text pre { white-space: pre-wrap; margin: 0; }
.map-chip.note { cursor: default; background: none; border-style: dashed; color: var(--muted); }
.more-notes { text-align: center; color: var(--faint); font-size: 13px; padding: 18px 0 8px; }
.chat-notes { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.file-cards { display: flex; gap: 8px; width: 100%; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
.file-cards.sent { justify-content: flex-end; flex-wrap: wrap; overflow: visible; padding: 0; margin-bottom: 6px; }
.file-cards.sent .file-card { width: 136px; height: 102px; }
.file-card {
  --tone: var(--tone-text);
  position: relative; flex: none; width: 160px; height: 120px; display: flex; flex-direction: column;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .05);
}
.file-card.tone-pdf { --tone: var(--tone-pdf); }
.file-card.tone-doc { --tone: var(--tone-doc); }
.file-card.tone-slides { --tone: var(--tone-slides); }
.file-card.tone-sheet { --tone: var(--tone-sheet); }
.file-card.tone-image { --tone: var(--tone-image); }
.file-peek { position: relative; flex: 1; min-height: 0; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--tone) 8%, var(--surface-2)); }
.file-peek img { width: 100%; height: 100%; object-fit: cover; }
.file-page {
  position: absolute; inset: 9px 12px 0; padding: 7px 8px; border-radius: 5px 5px 0 0;
  background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
  font-size: 7.5px; line-height: 1.4; color: var(--muted); white-space: pre-line; overflow: hidden; overflow-wrap: anywhere;
  -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent);
}
.file-page::first-line { font-weight: 700; color: var(--text); }
.file-glyph svg { width: 34px; height: 34px; color: var(--tone); }
.file-foot { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-top: 1px solid var(--line); background: var(--surface); }
.file-badge { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 2px 5px; border-radius: 5px; background: color-mix(in srgb, var(--tone) 13%, var(--surface)); color: var(--tone); font-size: 10.5px; font-weight: 750; letter-spacing: .02em; }
.file-badge svg { width: 12px; height: 12px; }
.file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 550; color: var(--text); }
.file-x {
  position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; font-size: 15px; line-height: 1; opacity: 0; transition: opacity .15s;
}
.file-card:hover .file-x, .file-x:focus-visible { opacity: 1; }
@media (hover: none) { .file-x { opacity: .85; } }
.file-reading { position: absolute; left: 8px; bottom: 6px; padding: 2px 7px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 600; box-shadow: var(--shadow); }
.file-card.reading .file-peek { animation: file-read 1.2s ease-in-out infinite alternate; }
@keyframes file-read { from { opacity: 1; } to { opacity: .55; } }
.note-img { display: block; max-width: 100%; height: auto; margin: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card, transparent); }
.msg .note-img { margin: 6px 0; }
.msg-steps { display: grid; gap: 2px; margin-bottom: 8px; padding: 6px 8px; border-radius: 10px; background: var(--surface-2); }
.msg-step { font-size: 12.5px; color: var(--muted); }
.msg-step > summary, div.msg-step { display: flex; align-items: center; gap: 6px; min-height: 22px; }
.msg-step > summary { cursor: pointer; list-style: none; }
.msg-step > summary::-webkit-details-marker { display: none; }
.msg-step-icon { width: 14px; height: 14px; flex: none; color: var(--accent); }
.msg-step-chevron { width: 14px; height: 14px; flex: none; transition: transform .18s cubic-bezier(.2, .8, .2, 1); }
.msg-step[open]:not(.closing) > summary > .msg-step-chevron { transform: rotate(90deg); }
.msg-step-count { margin-left: auto; font-size: 11.5px; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.msg-step ul { margin: 2px 0 4px 20px; padding: 0; list-style: none; }
.msg-step li { padding: 1px 0; color: var(--text); }
.msg-step-busy { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent); border-right-color: transparent; animation: step-spin .8s linear infinite; }
@keyframes step-spin { to { transform: rotate(360deg); } }
.proposal { margin: 10px 0 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; gap: 6px; }
.proposal-title { font-weight: 650; font-size: 14px; }
.proposal-why, .proposal-note, .proposal-done { font-size: 13px; color: var(--muted); }
.proposal-old, .proposal-new { white-space: pre-wrap; font-size: 13.5px; padding: 6px 8px; border-radius: 8px; }
.proposal-old { background: color-mix(in srgb, var(--danger) 12%, transparent); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--danger) 60%, transparent); }
.proposal-new { background: color-mix(in srgb, var(--good) 14%, transparent); }
.proposal-code pre { max-height: 180px; overflow: auto; margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; text-decoration: none; color: var(--text); }
.proposal-body { max-height: 220px; overflow: auto; font-size: 13.5px; border-left: 3px solid var(--line); padding-left: 10px; }
.proposal-buttons { display: flex; gap: 8px; }
.msg-acts { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
.msg-meta { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: default; }
.msg-act { font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.msg-act:hover { color: var(--accent); border-color: var(--accent); }
.chat-review { display: grid; gap: 6px; justify-items: start; text-align: left; margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--accent-soft); }
.chat-review b { font-size: 15px; }
.chat-review span { color: var(--muted); font-size: 13.5px; }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; color: var(--faint); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--muted); font-size: 12.5px; border: 0; white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.progress { background: none; padding: 0; }

.empty { text-align: center; color: var(--muted); padding: 56px 20px; }
.empty svg { width: 44px; height: 44px; color: var(--faint); }
.empty h3 { color: var(--text); margin: 10px 0 4px; font-size: 17px; }
.empty p { margin: 0; font-size: 14.5px; }

.note-head h1 { position: relative; min-height: 1.25em; font-size: 27px; line-height: 1.25; letter-spacing: -.02em; margin: 10px 0 8px; outline: 0; overflow-wrap: anywhere; cursor: text; }
.note-head h1.blank::before { content: attr(data-placeholder); color: var(--faint); position: absolute; left: 0; top: 0; pointer-events: none; }
.note-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; }
.note-meta .chip { cursor: pointer; }
#save-state { color: var(--faint); }

.prose { margin-top: 18px; font-size: 16.5px; line-height: 1.65; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { line-height: 1.3; margin: 1.4em 0 .5em; letter-spacing: -.01em; }
.prose h2 { font-size: 22px; }
.prose h3 { font-size: 19px; }

@media print {
  :root:root {
    --bg: #fff; --surface: #fff; --surface-2: #f0efec; --text: #1c1c1a; --muted: #555; --faint: #888;
    --line: #ddd; --accent: #4f46e5; --accent-soft: #eceafd; --code-bg: #f3f2ef; --shadow: none;
  }
  @page { margin: 22mm 24mm 24mm; @bottom-center { content: counter(page) " / " counter(pages); font: 9pt -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; color: #888; } }
  html { scrollbar-gutter: auto !important; }
  body { --side: 0px !important; --right: 0px !important; --top: 0px !important; --bottom: 0px !important; }
  html, body { background: #fff; color: #1c1c1a; padding: 0 !important; margin: 0; font-size: 11pt; line-height: 1.55; }
  .side, .bar, #floating, .toast, .toast-gone, .scrim, .scrim-gone, .note-meta, .doc-tail, .doc .blk .placeholder, .chat, .activity, .rec-pill, .chat-resize, .fab, .fabs, .actions, .select-bar, .dock, .tasks-window, .page-bar, .source-pane, .ask-float, .float-act, .map, .interview-split, [data-print-off] { display: none !important; }
  body.files-over main::after { display: none !important; }
  .interview-panes, .store-all { position: static !important; }
  main { max-width: none; width: auto; padding: 0 !important; margin: 0 !important; }
  .note-head h1, #title { margin: 0 0 10pt; padding-bottom: 6pt; border-bottom: 1px solid #ddd; font-size: 22pt; line-height: 1.2; }
  .doc .blk { margin-left: 0 !important; }
  .doc .blk h1 { font-size: 18pt; margin: 16pt 0 6pt; }
  .doc .blk h2 { font-size: 15pt; margin: 14pt 0 5pt; }
  .doc .blk h3 { font-size: 12.5pt; margin: 12pt 0 4pt; }
  .doc .blk h1, .doc .blk h2, .doc .blk h3, .doc .blk h4 { break-after: avoid; page-break-after: avoid; }
  .doc .blk p, .doc .blk li { orphans: 3; widows: 3; }
  .doc .blk pre { font-size: 9pt; line-height: 1.45; padding: 8pt 10pt; border: 1px solid #e3e2de; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .doc .blk pre, .doc .blk .table, .doc .blk img, .doc .blk figure, .doc .blk blockquote, .doc .blk .callout { break-inside: avoid; page-break-inside: avoid; }
  .doc .blk .table { font-size: 10pt; }
  .doc .blk img, .note-img { max-width: 100%; max-height: 180mm; }
  .diagram-art { border: 0; padding: 0; }
  .diagram-art svg { max-height: 150mm; }
  a { color: inherit; text-decoration: underline; }
}

@media (max-width: 899px) {

    left: auto; right: 12px; top: 12px; bottom: 12px; width: min(380px, 52cqw); max-height: none; overflow-y: auto;

.panel-head { position: relative; }

.interview-output { margin: 0; padding: 8px 10px; max-height: 160px; overflow: auto; border-radius: 8px; background: var(--code-bg); color: var(--text); font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.interview-review { display: grid; gap: 8px; }
.interview-review .pick-chips { padding: 0; }
.interview-review-more > summary { border-top: 0; padding: 4px 0; }
.interview-review-more .interview-verdicts { padding-top: 4px; }
@container interview (max-width: 899px) { .interview-practice .interview-solve:has(.interview-workspace) { grid-template-columns: 1fr; } }
@container interview (min-width: 900px) { .interview-practice .interview-workspace { position: sticky; top: calc(var(--top) + 72px); } }
.interview-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.interview-heading h1 { margin: 0 0 8px; overflow-wrap: anywhere; }
.interview-heading .hint { margin: 0; }
.interview-heading .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: .05em; margin: 0 0 10px; }
.interview-home .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.interview-home > .set-card { margin-bottom: 14px; }
.interview-home .btn:not(.primary):not(.danger) { background: var(--surface-2); color: var(--text); }
.interview-home .library-views .btn.on { background: var(--accent-soft); color: var(--accent); }
.interview-home .set-row { flex-direction: row; align-items: center; gap: 12px; }
.interview-home .set-row b { overflow-wrap: anywhere; }
.interview-home h2 { font-size: 19px; margin: 24px 0 12px; }
.interview-home .set-card h2 { margin: 0; }
.interview-tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.interview-track { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 20px 38px 20px 20px; margin: 0; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
.interview-track:hover { border-color: var(--track, var(--accent)); }
.track-icon { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 10px; background: color-mix(in srgb, var(--track, var(--accent)) 16%, transparent); color: var(--track, var(--accent)); }
.track-icon svg { width: 20px; height: 20px; }
.interview-track .track-icon { margin-bottom: 6px; }
.interview-plan-row { gap: 14px; }
.interview-heading-main { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.interview-heading-main .track-icon { width: 44px; height: 44px; border-radius: 12px; margin-top: 4px; }
.interview-heading-main .track-icon svg { width: 24px; height: 24px; }
.interview-plan-row:first-child { border-top: 0; }
.interview-plan-bar { display: block; width: min(260px, 100%); height: 5px; margin-top: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.interview-plan-bar i { display: block; height: 100%; border-radius: 3px; background: var(--track, var(--good)); }
.interview-track > svg { position: absolute; width: 18px; height: 18px; right: 14px; top: 24px; color: var(--muted); }
.interview-plan { display: flex; flex-direction: column; gap: 4px; border: 0; background: none; text-align: left; color: var(--text); padding: 8px 0; font: inherit; cursor: pointer; }
.interview-plan-tally { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.interview-plan-tally > span { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.interview-plan-tally > .solved { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--text); }
.interview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
.interview-toolbar .buttons { margin: 0; }
.interview-toolbar .hint { flex: 1; min-width: 160px; margin: 0; font-size: 13px; }
.interview-label { display: block; color: var(--text); font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; }
.interview-label .hint { font-weight: 400; margin-left: 8px; }
#interview-answer { min-height: 400px; resize: vertical; padding: 16px; line-height: 1.65; }
#interview-answer.interview-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.6; tab-size: 4; white-space: pre-wrap; overflow-wrap: anywhere; }
#interview-board { border: 1px solid var(--line); border-radius: 12px; background: #fff; color: #19191b; touch-action: none; overflow: hidden; aspect-ratio: 10 / 7; cursor: crosshair; }
#interview-board > svg { display: block; width: 100%; height: 100%; }
#interview-board [data-board-shape] { pointer-events: visiblePainted; outline: none; }
#interview-board[data-tool="select"] { cursor: default; }
#interview-board[data-tool="select"] [data-board-shape] { cursor: move; }
#interview-board[data-tool="text"] { cursor: text; }
#interview-board.panning, #interview-board.panning [data-board-shape] { cursor: grabbing; }
#interview-board [data-board-handle="nw"], #interview-board [data-board-handle="se"] { cursor: nwse-resize; }
#interview-board [data-board-handle="ne"], #interview-board [data-board-handle="sw"] { cursor: nesw-resize; }
#interview-board [data-board-handle="n"], #interview-board [data-board-handle="s"] { cursor: ns-resize; }
#interview-board [data-board-handle="e"], #interview-board [data-board-handle="w"] { cursor: ew-resize; }
#interview-board [data-board-handle="start"], #interview-board [data-board-handle="end"] { cursor: crosshair; }
#interview-board:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.interview-board-frame { position: relative; margin-top: 12px; }
.interview-board-editor { position: absolute; z-index: 2; min-width: 90px; padding: 2px 6px; border: 1.5px solid var(--accent); border-radius: 6px; background: #fff; color: #19191b; font-family: system-ui, sans-serif; line-height: 1.2; outline: none; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.interview-board-editor.middle { transform: translateX(-50%); text-align: center; }
.board-toolbar { flex-wrap: wrap; gap: 8px; }
.board-tools .btn { padding: 0 9px; }
.board-tools .btn svg { width: 18px; height: 18px; }
.board-tools .btn:disabled { opacity: .45; cursor: default; }
.interview-workspace .library-views { max-width: 100%; flex-wrap: wrap; }
.interview-panes { position: sticky; top: calc(var(--top) + 61px); z-index: 2; margin: -6px -6px 14px; padding: 6px 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.interview-panes[hidden] { display: none; }
.interview-panes .library-views { width: max-content; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.interview-panes .library-views::-webkit-scrollbar { display: none; }
.interview-panes .btn { flex: none; white-space: nowrap; }
.interview-problem .set-card { box-shadow: none; }
#interview-pane-submissions h2:first-child, #interview-pane-cases h3 { margin-top: 0; }
.interview-workspace .interview-toolbar > #interview-save { flex: none; min-width: 0; }
.interview-board-snapshot { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.interview-board-snapshot svg { width: 100%; display: block; }
.interview-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.interview-sources a { max-width: 100%; overflow-wrap: anywhere; white-space: normal; text-decoration: none; }
.interview-home .set-row .hint { display: block; margin-top: 3px; font-size: 13px; }
.interview-complete b { text-decoration: line-through; color: var(--muted); }
.interview-attempts { display: grid; gap: 8px; }
.interview-attempt { --tone: var(--line); border: 1px solid color-mix(in srgb, var(--tone) 60%, var(--line)); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.interview-attempt.passed { --tone: var(--good); }
.interview-attempt.failed { --tone: var(--danger); }
.interview-attempt.partly { --tone: var(--hue-amber); }
.interview-attempt > summary { color: var(--text); font-size: 15px; border-top: 0; padding: 0; flex-wrap: wrap; }
.interview-attempt[open] > summary { margin-bottom: 12px; }
.interview-attempt > .btn { margin: 0 0 12px; }
.interview-attempt > summary > .chip { flex: none; }
.interview-tally.pending { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.interview-attempt > summary .grow { min-width: 0; overflow-wrap: anywhere; }
.interview-attempt > summary .hint { margin-left: 10px; font-size: 12px; }
.interview-submitted { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; font-size: 13px; }
.chat-workspace { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 16px; text-align: left; cursor: pointer; }
.chat-workspace > svg { width: 16px; height: 16px; flex: none; }
.chat-workspace:not([hidden]) + .chat-modes { padding-top: 12px; }
@media (max-width: 600px) {
  .interview-heading { flex-direction: column; }
  .interview-tracks { grid-template-columns: 1fr; }
  .interview-toolbar .library-views { flex: none; }
  #interview-answer { min-height: 260px; }
  .interview-label .hint { display: block; margin: 4px 0; }
  .interview-attempt > summary .hint { display: block; margin-left: 0; }
}

</style>
