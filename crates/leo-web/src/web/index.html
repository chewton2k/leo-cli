* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (min-width: 1000px) { html { scrollbar-gutter: stable; } }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  --side: 0px;
  --right: 0px;
  --bar-row-height: 40px;
  --bar-height: calc(var(--top) + var(--bar-row-height) + 21px);

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }

  -webkit-user-select: none; user-select: none;

a { color: var(--accent); }
[hidden] { display: none !important; }

.bar {
  position: sticky; top: 0; z-index: 30;
  padding: calc(var(--top) + 10px) 16px 11px;
  background: var(--page);
}
.bar::after {
  content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 20px; pointer-events: none;
  background: var(--page); opacity: 0; transition: opacity var(--t-follow);
  -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent);
}
.bar.scrolled::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .bar::after { transition: none; } }
.bar-row { max-width: 728px; margin: 0 auto; display: flex; align-items: center; gap: 6px; min-height: var(--bar-row-height); }
.brand { font-weight: 750; font-size: 20px; letter-spacing: -.02em; border: 0; background: none; padding: 4px 6px 4px 2px; }
.crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; white-space: nowrap; color: var(--muted); font-size: 15px; }
.crumbs button { border: 0; background: none; padding: 4px 6px; border-radius: 8px; color: var(--muted); max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
.crumbs button:last-child { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--faint); }
.icon-btn {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.search {
  max-width: 760px; margin: 8px auto 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
}
.search svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
.search input { flex: 1; border: 0; outline: 0; background: none; padding: 10px 0; font-size: 16px; }

main { max-width: 760px; margin: 0 auto; padding: 8px 16px calc(var(--bottom) + 110px); }
:root { --note-width: 980px; }
:root[data-note-width="comfortable"] { --note-width: 760px; }
:root[data-note-width="full"] { --note-width: 100%; }
body.on-note main { max-width: none; margin-inline: 0; }
.note-layout { container: note / inline-size; }
.note-columns { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px auto; }
.note-columns > .note { grid-area: 2 / 1; min-width: 0; width: 100%; max-width: var(--note-width); margin-inline: auto; }
.note-outline { grid-area: 1 / 1; position: sticky; top: var(--outline-top, 76px); align-self: start; min-width: 0; z-index: 12; }
.note-outline .source-more { margin: 0; border: 0; padding: 0; }
.note-outline .source-more > summary { display: flex; gap: 8px; padding: 10px 8px; border: 0; color: var(--muted); }
.note-outline summary .outline-icon { flex: none; display: flex; }
.note-outline summary svg { flex: none; width: 18px; height: 18px; }
.note-outline nav { transform-origin: 0 0; max-height: min(50dvh, calc(100dvh - var(--outline-top, 76px) - 70px)); overflow-y: auto; overscroll-behavior: contain; padding: 4px; scrollbar-width: none; }
.note-outline nav::-webkit-scrollbar { display: none; }
.note-outline nav button { display: block; width: 100%; border: 0; border-radius: 6px; background: transparent; color: var(--muted); text-align: left; font-size: 13px; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note-outline nav button:hover { background: var(--surface-2); color: var(--text); }
.note-outline nav button[aria-current] { color: var(--accent); font-weight: 600; }
.note-outline nav ul { list-style: none; margin: 0; padding: 0; }
.note-outline nav ul ul { padding-left: 12px; }
.note-outline .outline-row { display: flex; align-items: center; min-width: 0; }
.note-outline .outline-row > button[data-line] { flex: 1; min-width: 0; }
.note-outline nav .outline-toggle { width: 24px; height: 32px; flex: none; display: grid; place-items: center; padding: 4px; }
.note-outline .outline-toggle svg { width: 16px; height: 16px; }
.note-outline .outline-toggle[aria-expanded="true"] svg { transform: rotate(90deg); }
.note-outline .outline-spacer { flex: none; width: 24px; }
.note-outline .outline-ticks, .note-outline .outline-preview { display: none; }
@container note (max-width: 899px) {
  .note-outline { background: var(--page); }
}
@container note (min-width: 900px) {
  .note-columns { grid-template-rows: auto; padding-inline: 48px; min-height: calc(100dvh - var(--bar-height) - 16px); }
  .note-columns > .note { grid-area: 1 / 1; }
  .note-outline { top: var(--outline-center, 50dvh); justify-self: start; width: 48px; margin-left: -48px; display: flex; flex-direction: column; }
  .note-outline .source-more { order: 1; }
  .note-outline .source-more > summary { width: 36px; justify-content: flex-start; padding: 8px 0 8px 8px; }
  .note-outline .source-more > summary > svg { display: none; }
  .note-outline .outline-ticks { display: flex; flex-direction: column; width: 100%; height: min(calc(var(--outline-count) * 12px), calc(100dvh - var(--outline-top, 76px) - 160px)); min-height: 12px; padding: 0 0 0 8px; border: 0; background: transparent; cursor: pointer; }
  .note-outline .outline-ticks:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .note-outline .outline-ticks span { position: relative; flex: 1; min-height: 0; display: block; width: 100%; transition: transform var(--t-drawer) var(--ease-arrive); transform-origin: left center; }
  .note-outline .outline-ticks span::after { content: ''; position: absolute; left: 0; top: calc(50% - 1px); width: 8px; height: 2px; border-radius: 1px; background: var(--faint); }
  .note-outline .outline-ticks span[data-level="1"]::after { width: 18px; }
  .note-outline .outline-ticks span[data-level="2"]::after { width: 12px; }
  .note-outline .outline-ticks span.on::after { background: var(--accent); }
  .note-outline .outline-ticks span[data-distance="0"] { transform: scale(1.7, 3); }
  .note-outline .outline-ticks span[data-distance="1"] { transform: scale(1.3, 1.8); }
  .note-outline .outline-ticks span[data-distance="2"] { transform: scale(1.1, 1.25); }
  .note-outline .outline-preview { transform-origin: 0 50%; transition: top var(--t-drawer) var(--ease-move); display: block; position: absolute; left: 48px; width: 280px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); pointer-events: none; font-size: 13px; line-height: 1.5; color: var(--text); }
  @media (prefers-reduced-motion: reduce) { .note-outline .outline-preview { transition: none; } }
  .outline-preview strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
  .outline-preview > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; margin-top: 4px; color: var(--muted); }
  .note-outline nav { position: absolute; top: 0; left: 40px; width: 280px; max-height: calc(100dvh - var(--outline-center, var(--outline-top, 76px)) - 12px); padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); opacity: 0; pointer-events: none; }
  .note-outline .source-more[open] nav { opacity: 1; pointer-events: auto; }
}
:root { --margin-w: 240px; --margin-gap: 24px; --ink-settling: color-mix(in srgb, var(--faint) 60%, #a58a62); }
.note-columns { position: relative; }
@container note (min-width: 900px) {
  .note-columns[data-margin="right"] { padding-right: calc(var(--margin-w) + var(--margin-gap) + 16px); }
  .note-columns[data-margin="both"] { padding-inline: calc(var(--margin-w) + var(--margin-gap) + 48px) calc(var(--margin-w) + var(--margin-gap) + 16px); }
  .note-columns[data-margin="both"] .note-outline { margin-left: calc(-1 * (var(--margin-w) + var(--margin-gap) + 48px)); }
}
.margin-layer { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
.margin-layer > * { pointer-events: auto; }
.margin-ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none !important; }
.margin-ink path { fill: none; stroke-linecap: round; }
.margin-ink path.squiggle { stroke: color-mix(in srgb, var(--text) 48%, transparent); stroke-width: 1; stroke-dasharray: 1 3; transition: opacity .14s ease-out; }
.margin-ink path.solid { stroke: var(--accent); stroke-width: 1.5; opacity: 0; transition: opacity .14s ease-out; }
.margin-ink path.wash { fill: var(--accent); stroke: none; opacity: 0; transition: opacity .14s ease-out; }
.margin-ink path.solid.on { opacity: 1; }
.margin-ink path.wash.on { opacity: .09; }
.margin-ink path.squiggle.on { opacity: 0; }
.margin-ink path.squiggle.arriving { animation: margin-wipe var(--wipe-t, .5s) linear var(--wipe-d, 0s) both; }
@keyframes margin-wipe { from { clip-path: inset(-4px 100% -4px 0); } to { clip-path: inset(-4px 0 -4px 0); } }
.margin-said-aloud { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.margin-note { position: absolute; left: 0; top: 0; width: var(--margin-w); color: var(--text); border-radius: 10px; }
.margin-note[hidden] { display: none; }
.margin-toggle { position: absolute; inset: -4px; z-index: 1; padding: 0; border: 0; border-radius: 10px; background: none; cursor: pointer; }
.margin-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.margin-note[data-open] .margin-toggle { inset: -6px -8px auto auto; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.margin-note[data-open] .margin-toggle::before { content: '×'; font-size: 17px; line-height: 1; color: var(--muted); }
.margin-note[data-open] .margin-toggle:hover::before { color: var(--text); }
.margin-note[data-open] .margin-said > :first-child { padding-right: 22px; }

.margin-said p, .margin-said > div { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.margin-felix { font-family: var(--voice); font-size: 15px; line-height: 1.46; color: var(--text); }
.margin-you { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.ink-word { display: inline-block; white-space: pre; animation: ink-in .64s ease both; }
@keyframes ink-in { from { opacity: 0; color: var(--ink-settling); } 45% { opacity: 1; color: var(--ink-settling); } to { opacity: 1; color: var(--text); } }
.margin-more { position: relative; z-index: 2; display: grid; grid-template-rows: 0fr; opacity: 0; visibility: hidden; transition: grid-template-rows var(--t-drawer) var(--ease-arrive), opacity var(--t-follow) var(--ease-arrive), visibility 0s var(--t-drawer); }
.margin-more-body { min-height: 0; overflow: hidden; }

.margin-reply { margin-top: 9px; }
.margin-reply textarea { display: block; width: 100%; margin: 0; padding: 0; border: 0; outline: 0; resize: none; background: none; color: var(--text); font: inherit; font-size: 13.5px; line-height: 1.45; }
.margin-reply textarea:focus-visible { outline: none; box-shadow: 0 1px 0 var(--accent); border-radius: 0; }

@property --side { syntax: '<length>'; inherits: true; initial-value: 0px; }
