[package]
name = "leo-services"
description = "AI providers, configuration, credentials, recording and capability checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# An in-memory credential store, so other crates' tests never reach the
# real keychain (which can block on a permission dialog).
test-support = []

[dependencies]
uuid.workspace = true
leo-core.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
colored.workspace = true
cpal.workspace = true
dirs.workspace = true
keyring.workspace = true
reqwest.workspace = true
tokio.workspace = true
roxmltree.workspace = true
quick-xml.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
lopdf.workspace = true
image.workspace = true
flate2.workspace = true
url.workspace = true
crc32fast.workspace = true
zip.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers.workspace = true
libc.workspace = true
zeroize.workspace = true
fs2 = "0.4"
log = "0.4"
regex = "1"
earshot = "1.2.2"
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["serde"] }
transcribe-cpp-sys = { version = "=0.4.0", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
