[package]
name = "leo-services"
description = "AI providers, configuration, credentials, recording and capability checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# An in-memory credential store, so other crates' tests never reach the
# real keychain (which can block on a permission dialog).
test-support = []

[dependencies]
leo-core.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
colored.workspace = true
cpal.workspace = true
dirs.workspace = true
keyring.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
lopdf.workspace = true
flate2.workspace = true
url.workspace = true
crc32fast.workspace = true
zip.workspace = true
tempfile.workspace = true
toml.workspace = true
toml_edit.workspace = true
sherpa-onnx.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
tokenizers.workspace = true
libc.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
