[package]
name = "leo-desktop"
description = "The leo app: its window, menu bar icon and built-in engine"
version.workspace = true
edition.workspace = true
rust-version = "1.90"

[[bin]]
name = "leo-app"
path = "src/main.rs"

[build-dependencies]
leo-core.workspace = true
tauri-build = { version = "2.7", features = [] }

[dependencies]
leo-core.workspace = true
leo-host.workspace = true
leo-services.workspace = true
leo-web.workspace = true
anyhow.workspace = true
tokio.workspace = true
url.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-updater = "=2.14.1"

tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false }
log = "0.4"
enigo = "0.6.1"
handy-keys = "0.3.4"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-global-shortcut = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
tauri-plugin-macos-permissions = "2.3.0"
libc.workspace = true
block2 = "0.6"
objc2-av-foundation = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Media_Audio", "Devices_Enumeration", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell"] }
