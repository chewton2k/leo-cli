[package]
name = "leo-desktop"
description = "The leo app: its window, menu bar icon and built-in engine"
version.workspace = true
edition.workspace = true
rust-version = "1.90"

[[bin]]
name = "leo-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
leo-core.workspace = true
leo-host.workspace = true
leo-web.workspace = true
anyhow.workspace = true
tokio.workspace = true
url.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"

[dev-dependencies]
tempfile.workspace = true
